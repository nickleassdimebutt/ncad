<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nCAD — Nick's generative CAD</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151b23; --raise:#1c242e; --line:#28313d; --line2:#374454;
    --ink:#dbe2ec; --dim:#8493a5; --faint:#5a6778;
    --cool:#4fc3f7;   /* parametric / precision / the pulse */
    --warm:#ff8a5c;   /* structural / load / heat */
    --ok:#57d38a; --warn:#e8c268; --bad:#ef6b6b;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);
       -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
  button{font:inherit;cursor:pointer}
  ::selection{background:rgba(79,195,247,.28);color:#fff}
  :focus-visible{outline:2px solid var(--cool);outline-offset:1px}

  /* ---------- header + GPU strip ---------- */
  .hdr{display:flex;align-items:center;justify-content:space-between;gap:16px;
       padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel);flex:none}
  .brand{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.14em;color:var(--dim);
         display:flex;align-items:baseline;gap:12px;min-width:0}
  .brand .n{color:var(--cool)} .brand b{color:var(--ink)}
  .gpu{font-family:var(--mono);font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:9px;flex:none}
  .gpu .lbl{letter-spacing:.14em}
  .gpu .bar{width:44px;height:7px;border-radius:2px;background:var(--line);overflow:hidden;position:relative}
  .gpu .bar i{position:absolute;inset:0;background:var(--warm);width:38%;
              animation:gpuidle 1.6s ease-in-out infinite;display:block}
  .gpu.idle .bar i{background:var(--line2);animation:none;width:100%}
  .gpu .who{color:var(--dim)} .gpu .who b{color:var(--ink);font-weight:600}
  @keyframes gpuidle{0%,100%{opacity:.55}50%{opacity:1}}

  /* ---------- three-zone shell ---------- */
  .shell{flex:1;display:grid;grid-template-columns:224px minmax(0,1fr) 312px;min-height:0}
  .rail{border-right:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0}
  .stage{min-width:0;min-height:0;overflow:auto;padding:18px}
  .dock{border-left:1px solid var(--line);background:var(--panel);
        display:flex;flex-direction:column;min-height:0;overflow:auto}
  @media(max-width:1080px){.shell{grid-template-columns:200px minmax(0,1fr)}
    .dock{display:none}}
  @media(max-width:720px){.shell{grid-template-columns:1fr}.rail{display:none}}

  /* ---------- rail: job tree ---------- */
  .railhead{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
            color:var(--faint);padding:14px 14px 8px}
  #tree{flex:1;overflow:auto;padding:0 8px}
  .node{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;
        border:1px solid transparent;color:var(--dim);cursor:pointer;font-size:13px;
        white-space:nowrap;overflow:hidden}
  .node:hover{background:var(--raise)}
  .node.sel{background:var(--raise);border-color:var(--line2);color:var(--ink)}
  .node .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
  .node .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .node .meta{font-family:var(--mono);font-size:9.5px;color:var(--faint);flex:none}
  .node .meta.best{color:var(--ok)}
  .node .trash{flex:none;border:0;background:none;color:var(--faint);font-size:11px;padding:0 2px;
               cursor:pointer;display:none;line-height:1}
  .node:hover .trash{display:block}
  .node .trash:hover{color:var(--bad)}
  .node .trash.arm{display:block;color:var(--bad);font-family:var(--mono);font-size:9.5px}
  .tidy{margin:2px 10px 0;padding:5px 9px;border:0;background:none;color:var(--faint);
        font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;cursor:pointer;text-align:left;flex:none}
  .tidy:hover{color:var(--dim)}
  .tidypanel{margin:0 10px 6px;padding:8px 10px;border:1px dashed var(--line2);border-radius:8px;
             font-size:11.5px;color:var(--dim);flex:none}
  .tidypanel button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--cool);
                    font-family:var(--mono);font-size:11px;padding:4px 0;cursor:pointer}
  .tidypanel button:hover{color:var(--ink)}
  .tidypanel button:disabled{color:var(--faint);cursor:default}
  .tidypanel .thint{font-size:10px;color:var(--faint);padding-top:4px}
  .child{margin-left:16px;position:relative;font-size:12.5px}
  .child::before{content:"";position:absolute;left:-9px;top:-4px;height:calc(50% + 4px);
                 width:8px;border-left:1px solid var(--line2);border-bottom:1px solid var(--line2)}
  .expand{margin-left:16px;font-family:var(--mono);font-size:10.5px;color:var(--cool);
          padding:3px 9px;cursor:pointer}
  .d-done{background:var(--ok)} .d-run{background:var(--cool);box-shadow:0 0 0 3px rgba(79,195,247,.16)}
  .d-queue{background:var(--warn)} .d-fail{background:var(--bad)} .d-ws{background:var(--faint)}
  .tray{border-top:1px dashed var(--line);margin:8px 6px 0;padding-top:8px}
  .tray .tl{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;
            color:var(--faint);padding:0 8px 5px;display:flex;gap:6px;align-items:center}
  .newbtn{margin:10px;padding:9px;border:1px dashed var(--line2);border-radius:8px;background:none;
          color:var(--cool);font-family:var(--mono);font-size:12px;letter-spacing:.04em;flex:none}
  .newbtn:hover{border-color:var(--cool);background:rgba(79,195,247,.06)}

  /* ---------- generic controls ---------- */
  h2.sh{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);
        font-family:var(--mono);font-weight:600;margin-bottom:10px}
  label.fl{display:block;font-size:12px;color:var(--dim);margin:12px 0 4px}
  input,textarea,select{width:100%;background:var(--raise);color:var(--ink);border:1px solid var(--line2);
    border-radius:6px;padding:7px 9px;font:inherit}
  input[type=number]{font-family:var(--mono)}
  textarea{min-height:96px;resize:vertical;line-height:1.55}
  .btn{width:100%;padding:10px;border:none;border-radius:8px;background:var(--cool);
       color:#062230;font-weight:700;font-size:14px}
  .btn:disabled{opacity:.5}
  .btn.warm{background:var(--warm);color:#20120b}
  .ghost{background:var(--raise);border:1px solid var(--line2);color:var(--dim);border-radius:6px;padding:6px 12px;font-size:12.5px}
  .err{color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px}
  .hint{color:var(--faint);font-size:12px}

  /* ---------- stage: new / draft ---------- */
  .card{max-width:640px;margin:0 auto}
  .card h1{font-size:22px;font-weight:750;letter-spacing:-.01em;margin-bottom:6px}
  .card .sub{color:var(--dim);margin-bottom:18px;max-width:52ch}

  /* engine segmented control */
  .seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin:2px 0}
  .seg button{padding:7px 18px;background:none;border:none;color:var(--dim);font-weight:600;font-size:13px}
  .seg button.on{background:var(--raise);color:var(--ink)}
  .seg button.on.struct{background:var(--warm);color:#20120b}
  .seg button.on.param{background:var(--cool);color:#062230}
  .seg.sm button{padding:5px 13px;font-size:12px}
  .rationale{color:var(--faint);font-size:12px;margin:6px 0 2px;max-width:52ch}
  #structOpts{border-left:2px solid var(--warm);padding-left:10px;margin:8px 0 2px}
  /* 2-axis style picker (gate + recipe) */
  .stylemap{width:100%;max-width:300px;display:block;border-radius:6px}
  .stylemap circle:hover{stroke:#fff}
  .stylecap{font-size:11.5px;color:var(--dim);margin-top:5px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;line-height:1.45}
  .stylecap b{color:var(--ink);font-weight:600}
  /* adaptive interview: confirm-not-ask gap chips (hard floor = engine + units) */
  .gapchips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 14px}
  .gapchips .gc{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:999px;
                border:1px solid var(--line2);color:var(--dim);background:var(--raise)}
  .gapchips .gc.warm{border-color:var(--warm);color:var(--warm)}
  .gapchips .gc.cool{border-color:var(--cool);color:var(--cool)}
  .gapchips .gc.warn{border-color:var(--warn);color:var(--warn)}

  .gaterow{display:grid;grid-template-columns:130px 1fr;gap:8px 16px;align-items:center;margin:6px 0}
  .gaterow .gk{font-family:var(--mono);font-size:11.5px;color:var(--faint);text-align:right}
  .conv{font-family:var(--mono);font-size:12px;color:var(--cool)}
  .feat{display:grid;grid-template-columns:1fr 76px 60px 26px;gap:6px;margin-bottom:6px}
  .feat button{background:none;border:none;color:var(--bad);font-size:16px}
  .skel{height:14px;border-radius:4px;background:linear-gradient(90deg,var(--raise),var(--line2),var(--raise));
        background-size:200% 100%;animation:shim 1.3s linear infinite}
  @keyframes shim{to{background-position:-200% 0}}

  /* schematic svg */
  .schematic{background:#080b0f;border:1px solid var(--line);border-radius:8px;margin-top:14px}

  /* ---------- stage: job viewport ---------- */
  .jobhead{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
  .jobhead .jn{font-size:18px;font-weight:700;letter-spacing:-.01em}
  .badge{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
         padding:3px 10px;border-radius:999px}
  .b-run{background:#123040;color:var(--cool);animation:pulse 1.3s infinite}
  .b-done{background:#10331f;color:var(--ok)} .b-fail{background:#3a1a1a;color:var(--bad)}
  .b-queue{background:#332a15;color:var(--warn)} .b-ws{background:#241f3a;color:#a99bf0}
  @keyframes pulse{50%{opacity:.5}}
  .stylepill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;
             padding:3px 10px 3px 6px;border-radius:999px;border:1px solid var(--line2);color:var(--dim)}
  .sw{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--line2);flex:none}
  .spacer{flex:1}

  .viewport{position:relative;background:#080b0f;border:1px solid var(--line2);border-radius:10px;
            aspect-ratio:16/9;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .viewport img{max-width:100%;max-height:100%;display:block}
  /* two stacked layers → cross-fade between frames (topo camera is fixed, so the
     structure grows IN PLACE). fade must be ≪ the poll interval. */
  .viewport .vlayer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;
                    transition:opacity .45s ease;background:#080b0f}
  /* live compliance / material sparklines (structural) */
  .spark{margin-top:10px;display:flex;flex-direction:column;gap:5px}
  .spk{display:grid;grid-template-columns:78px 1fr 46px;gap:9px;align-items:center;
       font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .spk svg{width:100%;height:30px;display:block;background:var(--raise);border-radius:4px}
  .spk b{text-align:right;font-variant-numeric:tabular-nums}
  /* parametric spec-diff mini-bars: measured vs target, center = on-spec */
  .specdiff{display:flex;flex-direction:column;gap:5px}
  .sd{display:grid;grid-template-columns:14px 1fr 56px;gap:9px;align-items:center;
      font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .sd .sdbar{position:relative;height:8px;background:var(--raise);border-radius:4px}
  .sd .sdbar u{position:absolute;left:50%;top:-1px;width:1px;height:10px;background:var(--line2)}
  .sd .sdbar i{position:absolute;top:1px;width:6px;height:6px;border-radius:50%;transform:translateX(-50%);transition:left .4s}
  .sd .sdbar i.ok{background:var(--ok)} .sd .sdbar i.off{background:var(--warn)}
  .sd b{text-align:right}.sd b.okc{color:var(--ok)}.sd b.offc{color:var(--warn)}
  .viewport .wash{position:absolute;inset:0;background:rgba(8,11,15,.55);
                  display:flex;align-items:flex-end;gap:10px;padding:12px 14px;font-family:var(--mono);font-size:12px;color:var(--ink)}
  .viewport .wash .sp{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);
                      border-top-color:var(--cool);animation:spin .9s linear infinite;flex:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  .viewport .pinned{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:11px;
                    background:rgba(79,195,247,.16);color:var(--cool);border:1px solid var(--cool);
                    border-radius:999px;padding:4px 11px;animation:pulse 1.3s infinite}
  /* Slice 14: on-PNG dimension callouts (SVG overlay; coords from the render's pixel-map sidecar) */
  .viewport .callouts{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  .viewport .callouts .wire{stroke:rgba(150,162,196,.35);stroke-width:1;fill:none}
  .viewport .callouts .lead{stroke:#ffd23c;stroke-width:2;fill:none}
  .viewport .callouts .tick{fill:#ffd23c}
  .viewport .callouts .lbl{fill:#ffe680;font:600 12px var(--mono);paint-order:stroke;stroke:#0a0d12;stroke-width:3px;stroke-linejoin:round}
  .viewport .callouts .lbu{fill:#9aa4bf;font:500 9px var(--mono);paint-order:stroke;stroke:#0a0d12;stroke-width:3px}
  /* Phase 1: hand-rolled WebGL STL viewer (offline, no deps) — takes over the viewport when on */
  .viewport .glview{position:absolute;inset:0;width:100%;height:100%;display:none;touch-action:none;
    pointer-events:none;cursor:default;background:#080b0f}
  .viewport.gl-visible .glview{display:block}
  .viewport.gl-interactive .glview{pointer-events:auto;cursor:grab}
  .viewport.gl-interactive .glview:active{cursor:grabbing}
  .viewport.gl-visible .vlayer,.viewport.gl-visible .callouts,.viewport.gl-visible .cmp,.viewport.gl-visible .wash{display:none!important}
  .viewport .glhint{position:absolute;left:10px;bottom:9px;font-family:var(--mono);font-size:10px;color:var(--dim);pointer-events:none;display:none}
  .viewport.gl-interactive .glhint{display:block}
  .viewport .picktools{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:4px;align-items:center;
    max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center;background:rgba(8,11,15,.82);border:1px solid var(--line2);border-radius:8px;padding:4px 6px;z-index:4}
  .viewport .picktools .pl{font-family:var(--mono);font-size:10px;color:var(--dim);padding:0 4px}
  .viewport .picktools button{background:var(--raise);border:1px solid var(--line2);color:var(--dim);
    font-size:11px;padding:3px 8px;border-radius:6px;cursor:pointer}
  .viewport .picktools button.on{background:var(--warm);color:#20120b;border-color:var(--warm)}
  .viewport .picktools button:hover{border-color:var(--warm)}
  .viewport .picktools .loadvec{display:flex;align-items:center;gap:3px;border-left:1px solid var(--line2);padding-left:6px}
  .viewport .picktools .loadvec input{width:43px;background:#080b0f;border:1px solid var(--line2);border-radius:4px;
    color:var(--ink);font:10px var(--mono);padding:3px 4px}
  .viewport .picktools .retainops{display:flex;align-items:center;gap:3px;border-left:1px solid var(--line2);padding-left:6px}
  .viewport .picktools .retainops button.on{background:rgba(79,195,247,.18);color:var(--ink);border-color:var(--cool)}
  .selectshape{position:absolute;display:none;border:1.5px dashed var(--cool);background:rgba(79,195,247,.10);
    pointer-events:none;z-index:5;box-shadow:0 0 0 1px rgba(8,11,15,.7)}
  .selectshape.circle{border-radius:50%}
  .selectshape.remove{border-color:var(--bad);background:rgba(255,90,90,.09)}
  .viewctl{position:absolute;right:12px;top:10px;width:146px;padding:6px;background:rgba(8,11,15,.88);
    border:1px solid var(--line2);border-radius:9px;z-index:5;display:none;box-shadow:0 5px 20px rgba(0,0,0,.25)}
  .viewport.gl-interactive .viewctl{display:block}
  .viewctl .vtitle{display:flex;justify-content:space-between;align-items:center;color:var(--faint);
    font:9px var(--mono);letter-spacing:.12em;text-transform:uppercase;margin:0 2px 5px}
  .viewctl .vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .viewctl button{background:var(--raise);border:1px solid var(--line2);border-radius:5px;color:var(--dim);
    font:9.5px var(--mono);padding:5px 2px;cursor:pointer}
  .viewctl button:hover,.viewctl button.on{border-color:var(--cool);color:var(--ink);background:rgba(79,195,247,.13)}
  .axis-tag{font:700 10px var(--mono);margin-left:2px}.axis-x{color:#ff6b6b}.axis-y{color:#63d471}.axis-z{color:#4fc3f7}
  .vecmeaning{font:10px var(--mono);color:var(--ink);white-space:nowrap;padding:0 4px}
  .axisgizmo{position:absolute;right:12px;bottom:10px;width:94px;height:94px;z-index:3;display:none;
    background:rgba(8,11,15,.68);border:1px solid var(--line2);border-radius:9px;pointer-events:none}
  .viewport.gl-interactive .axisgizmo{display:block}
  .axisgizmo line{stroke-width:2.2;stroke-linecap:round}.axisgizmo .neg{stroke-width:1;opacity:.3}
  .axisgizmo text{font:700 10px var(--mono);paint-order:stroke;stroke:#080b0f;stroke-width:3px}
  .axisgizmo .origin{fill:#dbe6f3}.axisgizmo .caption{fill:var(--dim);font:8px var(--mono);stroke-width:2px}
  /* revision compare: structural = draggable wipe (fixed camera registers), parametric = side-by-side */
  .cmp{position:absolute;inset:0}
  .cmp img.cmp-base,.cmp img.cmp-cur{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  .cmp .cmp-div{position:absolute;top:0;bottom:0;width:2px;background:var(--cool);cursor:ew-resize;touch-action:none}
  .cmp .cmp-div::after{content:"⇔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
                       background:var(--cool);color:#062230;border-radius:10px;font-size:11px;padding:1px 6px}
  .cmp .cmp-l{position:absolute;bottom:8px;font-family:var(--mono);font-size:10px;
              background:rgba(8,11,15,.72);padding:2px 7px;border-radius:4px;color:var(--ink)}
  .cmp .cl{left:8px}.cmp .cr{right:8px}
  .cmp-sbs{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cmp-sbs figure{position:relative;min-width:0}
  .cmp-sbs img{width:100%;height:100%;object-fit:contain}
  .cmp-sbs figcaption{position:absolute;bottom:6px;left:6px;font-family:var(--mono);font-size:10px;
                      background:rgba(8,11,15,.72);padding:2px 6px;border-radius:4px;color:var(--dim)}
  .cmpdelta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .cmpdelta .cd{font-family:var(--mono);font-size:11px;background:var(--raise);border:1px solid var(--line);
                border-radius:6px;padding:3px 9px;font-variant-numeric:tabular-nums}

  /* progress: stage-rail (param) + i/N bar (struct) */
  .prog{margin-top:12px;display:flex;align-items:center;gap:12px;font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pips{display:flex;gap:7px;align-items:center}
  .pips .pp{display:flex;gap:5px;align-items:center}
  .pips .pd{width:8px;height:8px;border-radius:50%;background:var(--line2)}
  .pips .pd.on{background:var(--cool)} .pips .pd.done{background:var(--ok)}
  .pips .ar{color:var(--line2)}
  .ibar{flex:1;height:7px;border-radius:4px;background:var(--raise);overflow:hidden;min-width:80px}
  .ibar i{display:block;height:100%;background:var(--warm);transition:width .4s}

  /* filmstrip */
  .film{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px;max-width:100%}
  .fr{flex:0 0 108px;background:var(--raise);border:1px solid var(--line);border-radius:7px;padding:5px;cursor:pointer}
  .fr.sel{border-color:var(--cool)}
  .fr img{width:100%;border-radius:3px;background:#080b0f;display:block;aspect-ratio:16/10;object-fit:cover}
  .fr .cap{display:flex;justify-content:space-between;margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
  .fr .pass{color:var(--ok)} .fr .fail{color:var(--bad)} .fr .evo{color:var(--warm)}
  .filmctl{display:flex;gap:8px;align-items:center;margin-top:8px}
  .filmctl button{font-family:var(--mono);font-size:11px;color:var(--dim);background:var(--raise);
                  border:1px solid var(--line2);border-radius:6px;padding:4px 10px}

  .failbox{margin-top:12px;border:1px solid var(--bad);border-left-width:3px;border-radius:8px;
           padding:10px 13px;background:rgba(239,107,107,.06);font-family:var(--mono);font-size:12px;color:var(--bad);white-space:pre-wrap}

  /* ---------- dock: recipe + metrics + log ---------- */
  .dsec{padding:14px 15px;border-bottom:1px solid var(--line)}

<body>
  <div class="hdr">
    <div class="brand"><span class="n">n</span><b>CAD</b></div>
    <div class="gpu idle" id="gpu"><span class="lbl">GPU</span><span class="bar"><i></i></span><span class="who">idle</span></div>
  </div>
  <div class="shell">
    <aside class="rail">
      <div class="railhead">Projects</div>
      <div id="tree"></div>
      <button class="tidy" id="tidybtn">🧹 tidy up…</button>
      <div class="tidypanel" id="tidypanel" style="display:none"></div>
      <button class="newbtn" id="newbtn">+ New part</button>
      <button class="newbtn" id="uplbtn" style="margin-top:0">⤒ Upload part → redesign</button>
      <button class="newbtn" id="settingsbtn" style="margin-top:0">⚙ AI settings</button>
      <input type="file" id="uplfile" accept=".stl,.step,.stp" style="display:none">
    </aside>
    <main class="stage" id="stage"></main>
    <aside class="dock" id="dock"></aside>
  </div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, h) => { const e = document.createElement(t); if(c) e.className = c; if(h!=null) e.innerHTML = h; return e; };
const esc = s => { const d = document.createElement("div"); d.textContent = s==null?"":s; return d.innerHTML; };
const escAttr = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const reduce = matchMedia("(prefers-reduced-motion:reduce)").matches;
const NOMINAL = { structural:130, stack:15, "llm-direct":180, mock:3 };  // seconds, for ETA
const RUNNING = new Set(["queued","configuring","generating","building","verifying","optimizing"]);
const ACTIVE = new Set(["configuring","generating","building","verifying","optimizing"]);
const STAGE_TEXT = { configuring:"configuring the design…", generating:"writing the script…",
  building:"building the STEP…", verifying:"measuring against your spec…",
  optimizing:"evolving the structure…", queued:"waiting for the GPU…" };

  const S = { jobs:[], status:{active:null,queue:[],now:0}, statusAt:0,
  sel:null, selIter:null, session:null, mode:"empty",
  expanded:{}, stageKind:null, stageJob:null, dockKey:null, film:{}, play:null, vfront:"A", compare:false,
  dims:false, maps:{}, gl3d:false, styles:null, regionHistory:[], retainOp:"add", textureView:"iso" };
/* aesthetic style presets (loaded once) + lookup for the job's chosen style */
async function loadStyles(){ try{ const r=await fetch("/api/styles"); S.styles=await r.json(); }catch(e){} }
function styleKey(j){ return (j&&j.config&&j.config.style)||(j&&j.style)||null; }
function styleOf(j){ const k=styleKey(j); return (k&&S.styles&&S.styles.styles&&S.styles.styles[k])||null; }
function safeHex(v,fb){ return (typeof v==="string"&&/^#[0-9a-fA-F]{3,8}$/.test(v))?v:(fb||"#8493a5"); }
function styleSwatch(pal){ return '<span class="sw" style="background:'+safeHex(pal&&pal.render_hex)+
  ';border-color:'+safeHex(pal&&pal.edge_hex)+'"></span>'; }

/* ---------------- polling ---------------- */
async function poll(){
  try{
    const [jr,wr,sr] = await Promise.all([fetch("/api/jobs"),fetch("/api/workspace"),fetch("/api/status")]);
    const real = await jr.json(), ws = await wr.json(); S.status = await sr.json(); S.statusAt = Date.now()/1000;
    const names = new Set(real.map(j=>j.name));
    const wsJobs = ws.filter(p=>!names.has(p.name)).map(p=>({
      id:"ws-"+p.name, name:p.name, state:"workspace", generator:"workspace",
      created:p.updated, updated:p.updated, log:[],
      iterations:p.versions.map(v=>({iteration:v.version,label:v.label,passed:null,
        metrics:v.metrics,preview:v.preview,step:v.step,viewer:v.viewer}))}));
    S.jobs = mergeJobs(real.concat(wsJobs));
  }catch(e){ /* keep last state on a hiccup */ }
  renderChrome();
  renderMain();
  // parametric bursts are fast (~1s/iter) → poll quicker; structural evolves
  // every ~2s so 2s keeps the cross-fade smooth without hammering.
  const activeJobs = S.jobs.filter(j=>RUNNING.has(j.state));
  const hasParam = activeJobs.some(j=>j.generator!=="structural");
  clearTimeout(poll._t); poll._t = setTimeout(poll, hasParam?1200 : activeJobs.length?2000 : 4000);
}
function job(id){ return S.jobs.find(j=>j.id===id); }
function selected(){ return job(S.sel); }
// upsert by id + preserve a just-submitted job until the server copy appears,
// so an in-flight poll can't drop it or a duplicate can't slip in
function mergeJobs(list){
  const seen=new Set(), out=[];
  for(const j of list){ if(!seen.has(j.id)){ seen.add(j.id); out.push(j); } }
  if(S.pendingJob){ if(seen.has(S.pendingJob.id)) S.pendingJob=null; else out.unshift(S.pendingJob); }
  return out;
}

/* ---------------- GPU strip (ticks every second) ---------------- */
function nowServer(){ return S.status.now + (Date.now()/1000 - S.statusAt); }
function fmtDur(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function renderGpu(){
  const g = $("#gpu"), a = S.status.active;
  if(!a){ g.className="gpu idle"; g.innerHTML='<span class="lbl">GPU</span><span class="bar"><i></i></span><span class="who">idle</span>'; return; }
  const el2 = a.started ? nowServer()-a.started : 0;
  const rem = Math.max(0, (NOMINAL[a.generator]||60) - el2);
  g.className="gpu";
  g.innerHTML = '<span class="lbl">GPU</span><span class="bar"><i></i></span>'+
    '<span class="who"><b>'+esc(a.name)+'</b> · '+esc(a.state)+' · '+fmtDur(el2)+' <span style="color:var(--faint)">(~'+fmtDur(rem)+' left)</span></span>';
}
setInterval(()=>{ if(S.status.active) renderGpu(); }, 1000);

/* queue position + ETA for a queued job */
function queueInfo(j){
  const q = S.status.queue||[]; const i = q.indexOf(j.id);
  if(i<0) return null;
  let eta = 0; const a = S.status.active;
  if(a) eta += Math.max(0,(NOMINAL[a.generator]||60)-(a.started?nowServer()-a.started:0));
  for(let k=0;k<i;k++){ const qj=job(q[k]); eta += NOMINAL[qj?qj.generator:"stack"]||60; }
  return { pos:i+1, eta };
}

/* ---------------- rail: nested revision tree ---------------- */
function baseName(n){ return n.replace(/-r\d+$/,""); }
function renderChrome(){
  renderGpu();
  const tree = $("#tree"); tree.innerHTML="";
  const real = S.jobs.filter(j=>j.state!=="workspace");
  const groups = {};   // root id -> [jobs]   (explicit lineage, not name-parsing)
  for(const j of real){ (groups[j.root||baseName(j.name)] ||= []).push(j); }
  // order groups by most-recent activity
  const order = Object.keys(groups).sort((a,b)=>
    Math.max(...groups[b].map(j=>j.updated||j.created)) - Math.max(...groups[a].map(j=>j.updated||j.created)));
  for(const key of order){
    const list = groups[key].slice().sort((a,b)=>(a.created||0)-(b.created||0));
    const parent = list.find(j=>j.id===key) || list[0];
    const revs = list.filter(j=>j!==parent);
    // variant gallery: mark the stiffest (lowest compliance) finished sibling
    let bestId=null, bestC=Infinity;
    if(list.length>1) for(const j of list){ const c=finalCompliance(j);
      if(j.state==="done"&&c!=null&&c<bestC){ bestC=c; bestId=j.id; } }
    tree.appendChild(nodeEl(parent, false, null, parent.id===bestId));
    const open = S.expanded[key];
    const shown = open ? revs : revs.slice(-1);
    if(!open && revs.length>1)
      tree.appendChild(expandEl(key, revs.length));
    for(const r of shown) tree.appendChild(nodeEl(r, true, parent, r.id===bestId));
    if(open && revs.length>1) tree.appendChild(expandEl(key, revs.length, true));
  }
  const wsJobs = S.jobs.filter(j=>j.state==="workspace");
  if(wsJobs.length){
    const tray = el("div","tray"); tray.appendChild(el("div","tl","🔒 from workspace"));
    for(const j of wsJobs) tray.appendChild(nodeEl(j,false));
    tree.appendChild(tray);
  }
  renderTidy();                                   // keep open tidy-panel counts live
}
function dotClass(state){
  if(state==="workspace") return "d-ws";
  if(state==="queued") return "d-queue";
  if(ACTIVE.has(state)) return "d-run";
  if(state==="failed"||state==="error"||state==="canceled") return "d-fail";
  return "d-done";
}
function finalCompliance(j){
  const its=j.iterations||[];
  for(let i=its.length-1;i>=0;i--){ const m=its[i].metrics; if(m&&m.compliance!=null) return +m.compliance; }
  return null;
}
function nodeLabel(j){
  const vl=j.config&&j.config.variant_label;
  const v=j.name.match(/-v(\d+)$/), r=j.name.match(/-r(\d+)$/);
  return vl || (v?("v"+v[1]) : r?("r"+r[1]) : "rev");
}
function nodeEl(j, child, parent, best){
  const n = el("div","node"+(child?" child":"")+(j.id===S.sel?" sel":""));
  let meta = j.state;
  const comp = finalCompliance(j);
  if(j.state==="queued"){ const q=queueInfo(j); if(q) meta = q.pos+"· ~"+fmtDur(q.eta); }
  else if(j.generator==="structural" && j.state==="done" && comp!=null){ meta = (best?"★ ":"")+"C "+(comp<1?comp.toFixed(2):comp.toFixed(1)); }
  else if(child && parent && parent.config && j.config){ meta = revDiff(parent.config,j.config)||"rev"; }
  const label = child ? nodeLabel(j) : j.name;
  n.innerHTML = '<span class="dot '+dotClass(j.state)+'"></span>'+
    '<span class="nm">'+esc(label)+'</span><span class="meta'+(best?" best":"")+'">'+esc(meta)+'</span>';
  n.onclick = ()=>selectJob(j.id);
  // hover 🗑 → armed "sure?" → moves the project dir to the macOS Trash (reversible).
  if(j.state!=="workspace" && !ACTIVE.has(j.state)){
    const t=document.createElement("button"); t.className="trash"; t.textContent="🗑"; t.title="move to Trash";
    t.onclick=(e)=>{ e.stopPropagation();
      if(!t.dataset.arm){ t.dataset.arm="1"; t.classList.add("arm"); t.textContent="sure?";
        t._t=setTimeout(()=>{ delete t.dataset.arm; t.classList.remove("arm"); t.textContent="🗑"; },3000);
        return; }
      clearTimeout(t._t); deleteJob(j); };
    n.appendChild(t);
  }
  return n;
}
async function deleteJob(j){
  try{
    const r=await fetch("/api/jobs/"+j.id+"/delete",{method:"POST"});
    const d=await r.json(); if(!r.ok) throw new Error(d.error||"delete failed");
  }catch(e){ alert("Couldn't delete "+j.name+": "+e.message); return; }
  S.jobs=S.jobs.filter(x=>x.id!==j.id);
  if(S.sel===j.id){ S.sel=null; renderMain(true); }
  renderChrome();
}
/* 🧹 tidy: bulk cleanup of the project pile. Everything goes to the macOS Trash
   (reversible) — the permanent step (emptying the Trash) stays the user's. */
function tidyCandidates(){
  const real=S.jobs.filter(j=>j.state!=="workspace");
  const wrecks=real.filter(j=>["failed","error","canceled"].includes(j.state));
  const fams={}; for(const j of real){ (fams[j.root||baseName(j.name)] ||= []).push(j); }
  const superseded=[];
  for(const key of Object.keys(fams)){
    const done=fams[key].filter(j=>j.state==="done");
    if(done.length<2) continue;
    const newest=done.reduce((a,b)=>(b.created||0)>(a.created||0)?b:a);
    let best=null,bc=Infinity;
    for(const j of done){ const c=finalCompliance(j); if(c!=null&&c<bc){ bc=c; best=j; } }
    for(const j of done) if(j!==newest && j!==best && j.id!==S.sel) superseded.push(j);
  }
  return {wrecks, superseded};
}
async function tidyRun(list,btn){
  let n=0;
  for(const j of list){
    btn.disabled=true; btn.textContent="… "+(++n)+"/"+list.length+"  "+j.name;
    try{ const r=await fetch("/api/jobs/"+j.id+"/delete",{method:"POST"});
      if(r.ok){ S.jobs=S.jobs.filter(x=>x.id!==j.id); if(S.sel===j.id) S.sel=null; }
    }catch(e){ /* skip; it stays in the list */ }
  }
  renderMain(true); renderChrome(); renderTidy();
}
function renderTidy(){
  const p=$("#tidypanel"); if(!p||p.style.display==="none") return;
  const {wrecks,superseded}=tidyCandidates();
  p.innerHTML=
    '<button id="tidyFail"'+(wrecks.length?"":" disabled")+'>✕ failed / canceled — '+wrecks.length+' job'+(wrecks.length===1?"":"s")+'</button>'+
    '<button id="tidyOld"'+(superseded.length?"":" disabled")+'>⌛ superseded revisions — '+superseded.length+' (keeps best + latest)</button>'+
    '<div class="thint">moves project folders to the macOS Trash — undo by dragging them back.</div>';
  const bf=$("#tidyFail"); if(bf&&wrecks.length) bf.onclick=()=>tidyRun(tidyCandidates().wrecks,bf);
  const bo=$("#tidyOld"); if(bo&&superseded.length) bo.onclick=()=>tidyRun(tidyCandidates().superseded,bo);
}
$("#tidybtn").onclick=()=>{ const p=$("#tidypanel");
  const open=p.style.display!=="none";
  p.style.display=open?"none":""; $("#tidybtn").textContent=open?"🧹 tidy up…":"🧹 tidy up ▴";
  renderTidy(); };
function expandEl(base, total, collapse){
  const e = el("div","expand", collapse?"▲ collapse":("+"+(total-1)+" revisions ▾"));
  e.onclick = ()=>{ S.expanded[base]=!S.expanded[base]; renderChrome(); };
  return e;
}
/* one-line config diff (child vs parent) */
function revDiff(a,b){
  const out=[];
  if(a.engine==="structural"&&b.engine==="structural"){
    if(a.volfrac!==b.volfrac) out.push("kept "+Math.round(a.volfrac*100)+"→"+Math.round(b.volfrac*100)+"%");
    for(let i=0;i<3;i++) if(a.domain_mm&&b.domain_mm&&a.domain_mm[i]!==b.domain_mm[i]){ out.push("xyz"[i]+" "+a.domain_mm[i]+"→"+b.domain_mm[i]); break; }
  } else if(a.params&&b.params){
    for(const k of Object.keys(b.params)) if(a.params[k]!==b.params[k]){ out.push(k+" "+a.params[k]+"→"+b.params[k]); if(out.length>=2)break; }
  }
  return out.join(" · ");
}

$("#uplbtn").onclick = ()=>$("#uplfile").click();
$("#uplfile").onchange = async (e)=>{

/* ---------------- main render (stage + dock) ---------------- */
function renderMain(force){
  let kind = S.mode;
  if(kind==="job" && !selected()){ kind = S.jobs.length?"job":"empty"; if(!selected()&&S.jobs.length){ S.sel=S.jobs[0].id; } }
  if(kind==="empty" && S.jobs.length && S.mode!=="new"){ S.sel=S.jobs[0].id; S.mode="job"; kind="job"; }
  renderStage(kind, force);
  renderDock(kind);
}

/* ---------- STAGE ---------- */
function renderStage(kind, force){
  const stage = $("#stage");
  const jid = kind==="job" ? S.sel : null;
  const remount = force || S.stageKind!==kind || (kind==="job" && S.stageJob!==jid);
  if(kind==="new"){ if(remount){ mountNew(); S.stageKind="new"; S.stageJob=null; } return; }
  if(kind==="settings"){ if(remount){ mountSettings(); S.stageKind="settings"; S.stageJob=null; } return; }
  if(kind==="drafting"||kind==="draft"){ if(remount) mountGate(); S.stageKind=kind; return; }
  if(kind==="clarify"){ if(remount) mountClarify(); S.stageKind=kind; return; }
  if(kind==="empty"){ stage.innerHTML='<div class="empty">No parts yet.<br>Hit <b style="color:var(--cool)">+ New part</b> to describe one.</div>'; S.stageKind="empty"; return; }
  // job
  const j = selected();
  if(remount){ mountJob(j); S.stageKind="job"; S.stageJob=jid; }
  updateJob(j);
}

async function submitClarifications(){
  const s=S.session, answers={...(s.answers||{})};
  document.querySelectorAll("[data-cq]").forEach(e=>answers[e.dataset.cq]=e.value.trim());
  const missing=(s.questions||[]).filter(q=>q.required&&!answers[q.key]).map(q=>q.q);
  if(missing.length){ $("#cErr").textContent="Please answer every required question."; return; }
  const key=$("#gKey")?$("#gKey").value.trim():"";
  s.answers=answers; $("#cErr").textContent=""; S.mode="drafting"; renderMain(true);
  try{
    if(key){
      const kr=await fetch("/api/settings/gemini",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({api_key:key})});
      const kj=await kr.json(); if(!kr.ok) throw new Error(kj.error||"could not save Gemini API key");
      s.geminiSetupRequired=false;
    }
    const r=await fetch("/api/sessions/"+s.id+"/answers",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({answers})});
    const j=await r.json();
    if(j.needs_clarification){ s.questions=j.questions||s.questions; s.failure=j.reason||"More detail is needed.";
      s.geminiSetupRequired=!!j.gemini_setup_required;
      S.mode="clarify"; renderMain(true); return; }
    if(!r.ok) throw new Error(j.error||"could not draft the spec");
    s.spec=j.spec; S.mode="draft"; renderMain(true);
  }catch(e){ s.failure="Draft retry failed: "+e.message; S.mode="clarify"; renderMain(true); }
}

/* deterministic gap-check → confirm-not-ask chips. Hard floor: always surface

function renderGapChips(){
  const box=$("#gapChips"); if(!box) return;
  const sp=S.session.spec, req=((S.session&&S.session.req)||"").toLowerCase(), chips=[];
  const ename=sp.engine==="structural"?"structural":sp.engine==="llm-direct"?"custom":"template";
  chips.push({t:"engine · "+ename, c:sp.engine==="structural"?"warm":"cool"});
  if(sp.capability_gaps&&sp.capability_gaps.length)
    chips.push({t:"custom geometry · "+sp.capability_gaps.join(", "),c:"warn"});
  if(sp.reference&&sp.reference.query){
    const grounded=sp.reference.mode==="grounded_search";
    chips.push({t:(grounded?"Gemini Search · ":"Gemini knowledge (not web-grounded) · ")+sp.reference.query,c:grounded?"cool":"warn"});
  }
  const styd=sp.style&&S.styles&&S.styles.styles&&S.styles.styles[sp.style];
  if(styd) chips.push({t:"style · "+styd.label, c:""});
  const imperial=/inch|inches|"|feet|foot|\bft\b|'/.test(req);
  chips.push({t:imperial?"units · mm ← imperial":"units · mm", c:"cool"});
  const clarifiedSize=(S.session.answers&&S.session.answers.overall)||"";
  if(!/\d/.test(req)&&!/\d/.test(clarifiedSize)) chips.push({t:"size inferred — confirm below", c:"warn"});
  const holes=sp.engine!=="structural" ? (sp.features||[]).reduce((n,f)=>n+(+f.count||0),0) : 0;
  if(holes) chips.push({t:holes+" hole"+(holes>1?"s":"")+" detected", c:""});
  box.innerHTML=chips.map(ch=>'<span class="gc '+ch.c+'">'+esc(ch.t)+'</span>').join("");
}
/* 2-axis style picker — round↔faceted (x) × skin-solid↔skeletal (y), palette dots,

function renderStyleMap(mount, current, engine, onpick){

  const spine=(data.spine||[]).filter(k=>keys.includes(k));
  const W=260,H=148, mx=16, my=14;
  const px=k=>mx+styles[k].axis.form*(W-2*mx), py=k=>my+(1-styles[k].axis.mass)*(H-2*my);

    '<text x="6" y="12" font-size="7.5" fill="var(--faint)">skeletal</text>';
  if(spinePts) svg+='<polyline points="'+spinePts+'" fill="none" stroke="var(--faint)" stroke-width="1" stroke-dasharray="3 2"/>';
  for(const k of keys){ const s=styles[k], on=k===current;
    const dim = engine && s.engine_affinity!=="either" && s.engine_affinity!==engine;
    svg+='<circle data-sk="'+escAttr(k)+'" cx="'+px(k).toFixed(1)+'" cy="'+py(k).toFixed(1)+'" r="'+(on?8:6)+'" '+
      'fill="'+safeHex(s.palette.render_hex)+'" stroke="'+(on?"#ffffff":safeHex(s.palette.edge_hex))+'" '+
      'stroke-width="'+(on?2.5:1.8)+'" opacity="'+(dim?"0.3":"1")+'" style="cursor:pointer">'+
      '<title>'+esc(s.label)+(dim?" (prefers "+esc(s.engine_affinity)+")":"")+'</title></circle>'; }

    c.innerHTML = s ? styleSwatch(s.palette)+'<b>'+esc(s.label)+'</b><span class="hint">· '+esc(s.finish)+' — '+esc(s.blurb)+'</span>'
      : '<span class="hint">no style · plain engine output (click a dot to apply; click it again to clear)</span>'; };
  drawCap(current);

    current = (current===c.dataset.sk)?null:c.dataset.sk;

      d.setAttribute("r", on?8:6); d.setAttribute("stroke", on?"#ffffff":safeHex(styles[d.dataset.sk].palette.edge_hex));

/* schematic wireframe from bbox+features — fills space, never blank */
function schematicSVG(sp){
  const b=sp.bbox||{}; const x=b.x||60,y=b.y||40,z=b.z||20;
  const W=260,H=150,pad=30; const sc=Math.min((W-2*pad)/(x+y*0.5),(H-2*pad)/(z+y*0.5));
  const dx=x*sc, dz=z*sc, dy=y*0.5*sc;
  const ox=pad, oy=H-pad-dy;
  const holes=sp.engine!=="structural" ? (sp.features||[]).reduce((n,f)=>n+(+f.count||0),0) : 0;
  let hc=""; const nh=Math.min(holes,8);
  for(let i=0;i<nh;i++){ const cx=ox+dx*((i+1)/(nh+1)), cy=oy-dz/2; hc+='<circle cx="'+cx.toFixed(0)+'" cy="'+cy.toFixed(0)+'" r="4" fill="#080b0f" stroke="'+(sp.engine==="structural"?"#ff8a5c":"#4fc3f7")+'" stroke-width="1.4"/>'; }
  const col=sp.engine==="structural"?"#ff8a5c":"#4fc3f7";
  return '<svg class="schematic" width="100%" height="150" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
    '<rect x="'+ox+'" y="'+oy+'" width="'+dx+'" height="'+dz+'" fill="none" stroke="'+col+'" stroke-width="1.5"/>'+
    '<path d="M'+ox+' '+oy+' l'+dy+' -'+dy+' h'+dx+' l-'+dy+' '+dy+'" fill="none" stroke="'+col+'" stroke-width="1" opacity=".55"/>'+
    '<path d="M'+(ox+dx)+' '+oy+' l'+dy+' -'+dy+' v'+dz+' l-'+dy+' '+dy+'" fill="none" stroke="'+col+'" stroke-width="1" opacity=".55"/>'+
    hc+'<text x="'+ox+'" y="'+(H-8)+'" fill="#5a6778" font-family="ui-monospace,monospace" font-size="9">'+x+' × '+y+' × '+z+' mm'+(holes?(" · "+holes+" holes"):"")+'</text></svg>';
}

function triKey(t){
  if(!t||t.length!==9) return "";
  const vs=[]; for(let i=0;i<3;i++) vs.push(t.slice(i*3,i*3+3).map(v=>(+v).toFixed(6)).join(","));
  return vs.sort().join("|");
}
function triCenter(t){ return [(t[0]+t[3]+t[6])/3,(t[1]+t[4]+t[7])/3,(t[2]+t[5]+t[8])/3]; }
function triangleMatcher(tris,tol=.008){
  const bins=new Map(), key=(x,y,z)=>x+":"+y+":"+z;
  (tris||[]).forEach(t=>{ const c=triCenter(t),q=c.map(v=>Math.floor(v/tol)),k=key(...q); (bins.get(k)||bins.set(k,[]).get(k)).push(c); });
  return t=>{ const c=triCenter(t),q=c.map(v=>Math.floor(v/tol));
    for(let x=-1;x<=1;x++)for(let y=-1;y<=1;y++)for(let z=-1;z<=1;z++){
      const a=bins.get(key(q[0]+x,q[1]+y,q[2]+z)); if(a&&a.some(p=>(p[0]-c[0])**2+(p[1]-c[1])**2+(p[2]-c[2])**2<=tol*tol)) return true; }
    return false; };
}

function vectorMeaning(d){
  if(!d||d.length!==3||!d.every(Number.isFinite)||Math.hypot(...d)<1e-9) return "enter a non-zero XYZ direction";
  const axes="XYZ", active=d.map((v,i)=>({v,i})).filter(o=>Math.abs(o.v)>1e-9);
  if(active.length===1){
    const o=active[0], sign=o.v<0?"−":"+";
    return sign+axes[o.i]+" · "+(o.v<0?"opposite the ":"along the ")+"+"+axes[o.i]+" arrow · scale ignored";
  }
  return "diagonal toward "+active.map(o=>(o.v<0?"−":"+")+axes[o.i]).join(" / ")+" · ratios set angle; scale ignored";
}

    const d=es.map(e=>+e.value); return d.length===3&&d.every(Number.isFinite)&&Math.hypot(...d)>1e-9?d:null; };
  const updateLoadMeaning=()=>{ const out=$("#jLoadMeaning"); if(out) out.textContent=vectorMeaning(loadVector()); };
  if(pt){
    pt.querySelectorAll("[data-lv]").forEach(e=>e.oninput=updateLoadMeaning);
    pt.querySelectorAll("button[data-tool]").forEach(b=>b.onclick=()=>pickTool(b.dataset.tool||null));
    pt.querySelectorAll("[data-retain-op]").forEach(b=>b.onclick=()=>{ S.retainOp=b.dataset.retainOp;
      pt.querySelectorAll("[data-retain-op]").forEach(x=>x.className=x===b?"on":""); GLV.setRetainOp(S.retainOp); });
    GLV.setRetainOp(S.retainOp||"add");
    // mistakes happen: ↩ and ✕ operate on loads while the load tool is active;
    // retain boundary selections use snapshot history so Add and Remove are undoable.
    pt.querySelector('[data-act="undo"]').onclick=()=>{
      if(S.pickTool==="load"){ syncLoadsFromDOM(); const l=(S.editLoads||[]).pop(); renderLoads();
        GLV.setHighlight(pickHighlights()); flash(l?"↩ removed load":"no loads to undo"); return; }
      syncRegionsFromDOM(); const prev=(S.regionHistory||[]).pop();
      let changed=false; if(prev){ S.editRegions=prev; changed=true; }
      else if((S.editRegions||[]).length){ S.editRegions.pop(); changed=true; }

      if(S.pickTool==="load"){ const n=(S.editLoads||[]).length; S.editLoads=[]; renderLoads();

      const preserveOnly=/^retain-/.test(S.pickTool||"");
      const n=(S.editRegions||[]).filter(r=>!preserveOnly||r.rule==="preserve").length;
      if(n) rememberRegions();
      S.editRegions=preserveOnly?(S.editRegions||[]).filter(r=>r.rule!=="preserve"):[]; renderRegions();
      GLV.setHighlight(pickHighlights());

  }
  const views=$("#jViews"); if(views) views.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
    GLV.setView(b.dataset.view); S.textureView=b.dataset.view;

    if(rule==="load"){

      if(!dir){ flash("✕ load direction must contain a non-zero X, Y, or Z"); return; }
      S.editLoads=S.editLoads||[];

      const load={box:pick.box.slice(),dir:dir.slice()}; if(pick.tris) load.tris=pick.tris;
      if(i<0&&S.editLoads.length===1&&!S.editLoads[0].tris) i=0; // first 3D pick replaces the lone recipe/default load
      if(i>=0) S.editLoads[i]=load; else S.editLoads.push(load);
      renderLoads(); GLV.setHighlight(pickHighlights());
      flash((i>=0?"↷ updated load":"＋ load")+" · "+vectorMeaning(dir)+" on "+pick.face+" face — Run revision to apply");
      return;
    }
    syncRegionsFromDOM();
    S.editRegions=S.editRegions||[];
    if(/^retain-/.test(rule)&&pick.tooLarge){
      flash("selection contains "+pick.ntri.toLocaleString()+" triangles; zoom in or draw a smaller boundary"); return;
    }
    if(/^retain-/.test(rule)&&pick.tris&&pick.tris.length){
      const keys=new Set(pick.tris.map(triKey)), selectedNear=triangleMatcher(pick.tris);
      if(S.retainOp==="remove"){
        let removed=0;
        const next=[];

          if(r.rule!=="preserve"||!r.tris){ next.push(r); return; }
          const keep=r.tris.filter(t=>{ const hit=keys.has(triKey(t))||selectedNear(t); if(hit) removed++; return !hit; });
          if(keep.length) next.push({...r,tris:keep});

        flash("− removed "+removed+" triangle"+(removed===1?"":"s")+" from retained regions"); return;
      }
      const old=[]; S.editRegions.forEach(r=>{ if(r.rule==="preserve"&&r.tris) old.push(...r.tris); });
      const have=new Set(old.map(triKey)), alreadyNear=triangleMatcher(old);
      const fresh=pick.tris.filter(t=>!have.has(triKey(t))&&!alreadyNear(t));
      if(!fresh.length){ flash("that area is already retained"); return; }
      rememberRegions();
      const chunk=20000;                          // also safe if the already-running server predates this fix
      for(let i=0;i<fresh.length;i+=chunk)
        S.editRegions.push({box:pick.box.slice(),rule:"preserve",tris:fresh.slice(i,i+chunk)});
      renderRegions(); GLV.setHighlight(pickHighlights());
      flash("＋ retained "+fresh.length.toLocaleString()+" visible triangle"+(fresh.length===1?"":"s")+" — Run revision to apply"); return;
    }
    // clicking an already-picked face unpicks it (same rule) or just swaps its rule
    const i=S.editRegions.findIndex(r=>r.tris&&same(r.box,pick.box));
    rememberRegions();
    if(i>=0){
      if(S.editRegions[i].rule===rule){ S.editRegions.splice(i,1); flash("− unpicked face (click again to re-add)"); }
      else { S.editRegions[i].rule=rule; flash("↷ face is now "+rule); }
    } else {
      const reg={box:pick.box, rule}; if(pick.tris) reg.tris=pick.tris;
      S.editRegions.push(reg);
      flash(pick.tris ? ("＋ "+rule+" · "+pick.ntri+"-triangle face — Run revision to apply")

    }

/* cross-fade the viewport to a new frame url (fixed camera ⇒ registers in place) */
function showFrame(url){

  const front = S.vfront==="B"?b:a, back = S.vfront==="B"?a:b;
  if(front.dataset.src===url) return;                 // already the live layer
  const swap=()=>{ back.style.opacity=1; front.style.opacity=0; S.vfront=(S.vfront==="B")?"A":"B"; };
  if(back.dataset.src===url){ swap(); return; }        // preloaded → just cross-fade

function paintCallouts(j, m){

function wipeDrag(box){
  const div=box.querySelector(".cmp-div"), cur=box.querySelector(".cmp-cur");

function compareDelta(j,base){
  const a=finalMetrics(base), b=finalMetrics(j), chips=[]; if(!a||!b) return "";
  const chip=(label,d,fmtAbs,lowerBetter)=>{ if(d==null||isNaN(d)) return;
    const neutral=Math.abs(d)<1e-9, good=lowerBetter?d<0:d>0;
    const col=lowerBetter==null?"var(--cool)":neutral?"var(--dim)":(good?"var(--ok)":"var(--bad)");
    chips.push('<span class="cd" style="color:'+col+'">'+label+' '+(neutral?"=":(d<0?"▼":"▲"))+

    if(a.vol_fraction!=null&&b.vol_fraction!=null) chip("material",b.vol_fraction-a.vol_fraction,v=>Math.round(v*100)+"pp",null);
    if(a.mesh_volume_mm3!=null&&b.mesh_volume_mm3!=null) chip("volume",(b.mesh_volume_mm3-a.mesh_volume_mm3)/1000,v=>v.toFixed(2)+"cm³",null);
  } else {
    const ad=a.dimensions,bd=b.dimensions;
    if(ad&&bd) for(const ax of ["x","y","z"]) if(ad[ax]!=null&&bd[ax]!=null&&Math.abs(bd[ax]-ad[ax])>1e-6) chip(ax,bd[ax]-ad[ax],v=>v.toFixed(2)+"mm",null);
    if(a.volume!=null&&b.volume!=null) chip("volume",(b.volume-a.volume)/1000,v=>v.toFixed(2)+"cm³",null);

  if(kind!=="job"){ dock.innerHTML='<div class="dsec"><div class="empty" style="padding:40px 10px">The recipe appears here once a part is built.</div></div>'; S.dockKey=null; return; }
  const j=selected(); if(!j){ dock.innerHTML=""; return; }
  const shown=shownIter(j);
  const key=j.id+":"+j.state+":"+JSON.stringify(j.config||null);
  const metricsHtml = metricsBlock(j,shown);
  const logHtml = '<div class="dsec"><h2 class="sh">Engineer log</h2><pre class="log" id="dLog"></pre></div>';
  if(S.dockKey!==key){
    // rebuild (config or state changed) — safe: not editing mid-run
    dock.innerHTML='<div class="dsec" id="dRecipe"></div>'+
      '<div class="dsec" id="dMetrics"></div>'+logHtml;
    S.dockKey=key; renderRecipe(j);
  }
  $("#dMetrics").innerHTML=metricsHtml;
  const se=$("#dStructuralize"); if(se) se.onclick=()=>openStructuralEditor(j,shown,se);
  const lg=$("#dLog"); if(lg){ const atEnd=lg.scrollTop+lg.clientHeight>=lg.scrollHeight-8;
    lg.textContent=(j.log||[]).join("\n"); if(atEnd) lg.scrollTop=lg.scrollHeight; }
}
function metricsBlock(j,shown){
  let h='<h2 class="sh">Result</h2>';
  const m=shown&&shown.metrics;
  if(m&&m.dimensions){ const d=m.dimensions;
    h+='<div class="metric"><span>dimensions</span><b>'+d.x+' × '+d.y+' × '+d.z+' mm</b></div>'+
       '<div class="metric"><span>volume</span><b>'+(m.volume/1000).toFixed(2)+' cm³</b></div>'+
       '<div class="metric"><span>valid solid</span><b>'+(m.is_valid?"yes":"NO")+'</b></div>';
  } else if(m){
    const texture=m.surface_texture;
    h+='<div class="metric"><span>compliance</span><b>'+(m.compliance!=null?(+m.compliance).toFixed(3):"—")+'</b></div>'+
       '<div class="metric"><span>total material</span><b>'+(m.vol_fraction!=null?Math.round(m.vol_fraction*100)+"%":"—")+'</b></div>'+
       (m.mass_change_pct!=null?'<div class="metric"><span>mass change</span><b>'+(+m.mass_change_pct>=0?"+":"")+(+m.mass_change_pct).toFixed(2)+'%</b></div>':"")+
       (m.mass_tolerance_pct!=null?'<div class="metric"><span>allowed mass change</span><b>±'+(+m.mass_tolerance_pct).toFixed(1)+'%</b></div>':"")+
       (texture?'<div class="metric"><span>surface texture</span><b>'+esc(texture.mode+' '+texture.pattern+' · '+texture.height_mm+' mm · '+(texture.angle_deg||0)+'° · '+(texture.mapping||"legacy triplanar")+' · '+(texture.scope||"selected surface"))+'</b></div>':"")+
       (m.design_vol_fraction!=null?'<div class="metric"><span>free-region material</span><b>'+Math.round(m.design_vol_fraction*100)+'%</b></div>':"")+
       (m.load_cases!=null?'<div class="metric"><span>independent load cases</span><b>'+m.load_cases+'</b></div>':"")+
       (m.surface_mode?'<div class="metric"><span>final surface</span><b>'+esc(m.surface_mode)+(m.selected_iteration!=null?' · iter '+m.selected_iteration:'')+'</b></div>':"")+
       (m.mesh_volume_mm3?'<div class="metric"><span>material</span><b>'+(m.mesh_volume_mm3/1000).toFixed(1)+' cm³</b></div>':"");
    if(texture&&texture.sampling_limited){
      const requested=+texture.sampling_edge_mm, effective=+texture.effective_sampling_edge_mm;
      h+='<div class="materialwarn">Surface detail reached the export safety limit'+
        (Number.isFinite(requested)&&Number.isFinite(effective)?': requested '+requested.toFixed(3)+' mm edges; used '+effective.toFixed(3)+' mm':'')+
        '. Increase feature size or accept a larger STL to resolve it more finely.</div>';
    }
  } else h+='<div class="hint">building…</div>';
  const fileHref = p => '/files/'+encodeURI(p).replace(/"/g,"%22");
  const links=[]; if(shown&&shown.step)links.push('<a href="'+fileHref(shown.step)+'">↓ STEP</a>');
  if(shown&&shown.stl)links.push('<a href="'+fileHref(shown.stl)+'">↓ STL</a>');
  if(shown&&shown.viewer)links.push('<a href="'+fileHref(shown.viewer)+'" target="_blank">↗ 3D viewer</a>');
  if(links.length) h+='<div class="links">'+links.join("")+'</div>';
  if(j.generator==="stack"&&j.state==="done"&&shown&&shown.step)
    h+='<button class="btn warm" id="dStructuralize" style="margin-top:10px;width:100%">◲ Open in 3D + add loads →</button>';
  const fullMaterial=j.generator==="structural"&&j.config&&j.config.revision_mode!=="form"&&+j.config.volfrac>=0.999;
  if(fullMaterial) h+='<div class="materialwarn">100% material target — this result was required to keep the original amount of material, so no topology reduction occurred.</div>';
  else if(shown&&shown.passed) h+='<div style="color:var(--ok);font-size:12.5px;margin-top:8px">✓ all requirements met</div>';
  return h;
}

/* Turn an exact parametric STEP into the unchanged structural baseline. The existing
   local upload path already performs STEP→STL conversion and seeds editable loads. */
async function openStructuralEditor(j,shown,btn){
  const was=btn.textContent; btn.disabled=true; btn.textContent="⏳ preparing structural editor…";
  try{
    const src=await fetch('/files/'+encodeURI(shown.step));
    if(!src.ok) throw new Error("could not read the generated STEP");
    const body=await src.blob(), stem=(baseName(j.name)+"-loads").toLowerCase()
      .replace(/[^a-z0-9_-]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"part-loads";
    let proj=stem,n=2; while(S.jobs.some(x=>x.name===proj)) proj=(stem+"-r"+(n++)).slice(0,40);
    const r=await fetch("/api/upload?name="+encodeURIComponent(j.name+".step")+
      "&project="+encodeURIComponent(proj),
      {method:"POST",headers:{"Content-Type":"application/octet-stream"},body});
    const nj=await r.json(); if(!r.ok) throw new Error(nj.error||"structural conversion failed");
    S.pendingJob=nj; S.jobs=mergeJobs([nj].concat(S.jobs));
    S.expanded[nj.root||baseName(nj.name)]=true; selectJob(nj.id); renderChrome(); poll();
  }catch(e){ btn.disabled=false; btn.textContent="✕ "+String(e.message||e).slice(0,42);
    setTimeout(()=>{ btn.textContent=was; },3600); }
}

/* -------- recipe editor (LLM-free revision) -------- */
function regionSentence(box){
  const ax=["x","y","z"],names=[];
  for(let i=0;i<3;i++){ const a=box[i],b=box[i+3];
    if(b-a<=0.05){ if(a<=0.02)names.push({x:"the left (−X) face",y:"the front (−Y) face",z:"the bottom (−Z) face"}[ax[i]]);
      else if(b>=0.98)names.push({x:"the right (+X) face",y:"the back (+Y) face",z:"the top (+Z) face"}[ax[i]]);
      else names.push("mid "+ax[i]); }
    else if(a>0.02||b<0.98) names.push(ax[i]+" "+Math.round(a*100)+"–"+Math.round(b*100)+"%"); }
  return names.length?names.join(", "):"the whole body";
}
function box6(kind,idx,box,mode){ const order=[0,3,1,4,2,5],
  cells=mode==="range"?["x from","x to","y from","y to","z from","z to"]:["x0","x1","y0","y1","z0","z1"];
  return '<div class="box6 '+(mode==="range"?"range":"")+'">'+order.map((oi,k)=>'<label>'+cells[k]+
    '<input type="number" min="0" max="100" value="'+Math.round(box[oi]*100)+'" data-r="'+kind+'-'+idx+'-'+oi+'"></label>').join("")+'</div>'; }
/* direct manipulation: click a cube face to snap a support/load to canonical 0..1 box */
const FACES=[["left","◧ left (−X)",[0,0,0,0.06,1,1]],["right","right (+X) ◨",[0.94,0,0,1,1,1]],
  ["front","front (−Y)",[0,0,0,1,0.06,1]],["back","back (+Y)",[0,0.94,0,1,1,1]],
  ["bottom","▼ bottom (−Z)",[0,0,0,1,1,0.06]],["top","top (+Z) ▲",[0,0,0.94,1,1,1]]];
function faceOf(box){ for(const f of FACES){ if(f[2].every((v,i)=>Math.abs(v-box[i])<0.02)) return f[0]; } return null; }
function facePicker(kind,idx,box){
  const cur=faceOf(box);
  return '<div class="faces" data-fp="'+kind+'-'+idx+'">'+FACES.map(f=>
    '<button type="button" class="'+(f[0]===cur?"on":"")+'" data-f="'+f[0]+'">'+esc(f[1])+'</button>').join("")+'</div>';
}
function wireFaces(){
  document.querySelectorAll("[data-fp]").forEach(fp=>{
    const dash=fp.dataset.fp.lastIndexOf("-"), kind=fp.dataset.fp.slice(0,dash), idx=fp.dataset.fp.slice(dash+1);
    fp.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
      const slab=FACES.find(f=>f[0]===btn.dataset.f)[2];
      for(let o=0;o<6;o++){ const inp=$('[data-r="'+kind+'-'+idx+'-'+o+'"]'); if(inp) inp.value=Math.round(slab[o]*100); }
      fp.querySelectorAll("button").forEach(b=>b.className=b===btn?"on":"");
    });
  });
}
function syncLoadsFromDOM(){
  const g=s=>$('[data-r="'+s+'"]');
  (S.editLoads||[]).forEach((l,i)=>{
    for(let o=0;o<6;o++){ const e=g("load-"+i+"-"+o); if(e) l.box[o]=Math.max(0,Math.min(1,+e.value/100)); }
    const d=[0,1,2].map(a=>{ const e=g("loadvec-"+i+"-"+a); return e?+e.value:l.dir[a]; });
    if(d.every(Number.isFinite)&&Math.hypot(...d)>1e-9) l.dir=d;
  });
}
function renderLoads(){
  const box=$("#rLoads"); if(!box) return;
  const loads=S.editLoads||[];
  box.innerHTML=loads.length?loads.map((l,i)=>{
    const d=(l.dir&&l.dir.length===3?l.dir:[0,0,-1]);
    const vec='<span class="vec3">F = ['+[0,1,2].map(a=>'<span class="axis-tag axis-'+"xyz"[a]+'">'+"XYZ"[a]+'</span>'+
      '<input type="number" step="any" value="'+escAttr(d[a])+'" data-r="loadvec-'+i+'-'+a+'" aria-label="load '+"xyz"[a]+'">').join("")+
      ']</span> <span class="vecmeaning" data-vmean="'+i+'">'+esc(vectorMeaning(d))+'</span>';
    const rm='<button type="button" class="regx" data-rmload="'+i+'" title="remove load">✕</button>';
    return '<div class="sen">⬇ <b style="color:var(--ink)">Load:</b> '+regionSentence(l.box)+' · '+vec+rm+'</div>'+
      '<div class="bcnote">X/Y/Z are direction ratios, not force magnitude. [0,0,−1], [0,0,−100], and [0,0,−1000] are identical. Negating every component reverses the direction; changing their relative ratios changes the angle.</div>'+
      (l.tris?'<div class="sen">🔺 exact 3D face patch · '+l.tris.length+' tris</div>':facePicker("load",i,l.box)+box6("load",i,l.box,"range"));
  }).join(""):'<div class="hint" style="padding:2px 0 0">none — add one with the 3D load tool or recipe.</div>';
  box.querySelectorAll("[data-rmload]").forEach(b=>b.onclick=()=>{
    syncLoadsFromDOM(); S.editLoads.splice(+b.dataset.rmload,1); renderLoads(); wireFaces();
    if(S.gl3d) GLV.setHighlight(pickHighlights()); });
  box.querySelectorAll('[data-r^="loadvec-"]').forEach(inp=>inp.oninput=()=>{
    const p=inp.dataset.r.split("-"),i=+p[1];
    const d=[0,1,2].map(a=>{const e=box.querySelector('[data-r="loadvec-'+i+'-'+a+'"]');return e?+e.value:0;});
    const out=box.querySelector('[data-vmean="'+i+'"]'); if(out) out.textContent=vectorMeaning(d);
  });
  wireFaces();
}

       '<div id="rStructuralOptions"'+(rmode==="structural"?"":' style="display:none"')+'>'+
       '<div class="rl"><span class="rk">quality</span><span class="rv"><select data-r="quality" style="width:auto;display:inline-block;font-size:11px;padding:2px 5px">'+
         ['draft','balanced','fine','ultra'].map(q=>'<option value="'+q+'"'+((cfg.quality||"draft")===q?" selected":"")+'>'+q+'</option>').join("")+'</select></span></div>'+
       '<div class="rl"><span class="rk">creativity</span><span class="rv"><select data-r="creativity" style="width:auto;display:inline-block;font-size:11px;padding:2px 5px">'+
         [['focused','Focused'],['explore','Explore'],['wild','Wild']].map(o=>'<option value="'+o[0]+'"'+(ckey===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select></span></div>'+
       '<div class="rl"><span class="rk">mesh detail</span><span class="rv"><select data-r="mesh_detail" style="width:auto;display:inline-block;font-size:11px;padding:2px 5px">'+
         [[1,'coarse'],[2,'smooth'],[3,'fine']].map(o=>'<option value="'+o[0]+'"'+((+cfg.mesh_detail||2)===o[0]?" selected":"")+'>'+o[1]+'</option>').join("")+'</select> <span class="hint">surface only</span></span></div>'+
       (cfg.seed!=null?'<div class="rl"><span class="rk">seed</span><span class="rv">'+esc(cfg.seed)+(cfg.variant_label?" · "+esc(cfg.variant_label):"")+'</span></div>':'')+
       '</div>';
    h+='<div id="rStructuralBC"'+(rmode==="structural"?"":' style="display:none"')+'>';
    if((cfg.supports||[]).length) h+='<div class="grp">Anchored area <span class="hint" style="font-weight:400">— bolted, clamped, or touching ground</span></div>';
    (cfg.supports||[]).forEach((s,i)=>{ h+='<div class="sen">🔒 <b style="color:var(--ink)">Held still:</b> '+regionSentence(s.box)+'</div>'+
      '<div class="bcnote">This is where the part cannot move; loads must travel back to this area.</div>'+
      facePicker("sup",i,s.box)+box6("sup",i,s.box,"range"); });
    h+='<div class="grp">Force applied <span class="hint" style="font-weight:400">— face + unitless XYZ direction</span></div>'+
       '<div id="rLoads"></div></div>';
    h+='<div class="grp">Keep regions <span class="hint" style="font-weight:400">— '+(rmode==="form"?"protect surfaces while the rest is refined":"pin surfaces while the rest optimizes")+'</span></div>'+
       '<div id="rRegions"></div>'+
       '<button type="button" class="ghost" id="rAddReg" style="margin-top:6px;font-size:11px;padding:4px 9px">+ add keep region</button>';
  } else if(cfg.template){
    const bj=baselineJob(j), baseParams=(bj&&bj.config&&bj.config.params)||null;
    const entries=Object.entries(cfg.params);
    const prim=entries.filter(([k])=>PRIMARY_PARAMS.has(k)), fine=entries.filter(([k])=>!PRIMARY_PARAMS.has(k));
    h+='<div class="hint" style="margin-bottom:6px">template: <b style="color:var(--ink)">'+esc(cfg.template)+'</b></div>';
    h+='<div class="grp">Primary</div>'+(prim.length?prim:entries).map(([k,v])=>paramRow(k,v,baseParams)).join("");
    if(prim.length && fine.length)
      h+='<div class="expand" id="showAll" data-total="'+entries.length+'" style="margin-left:0;padding:7px 0">+ show all '+entries.length+' fields ▾</div>'+
         '<div id="fineGrp" style="display:none"><div class="grp">Fine control</div>'+fine.map(([k,v])=>paramRow(k,v,baseParams)).join("")+'</div>';
  }
  h+='</div><button class="btn" id="dRev" style="margin-top:12px">'+(cfg.engine==="structural"?revisionRunLabel(cfg.creativity||j.creativity||"focused"):"Run revision →")+'</button><div class="err" id="dRevErr"></div>';
  wrap.innerHTML=h;
  $("#dRev").onclick=runRevision;
  wireFaces();
  const vf=$('[data-r="volfrac"]'), rmode=$('[data-r="revision_mode"]');
  const materialGuard=()=>{
    const mode=rmode?rmode.value:"structural", note=$("#rVolNote"), btn=$("#dRev"), pct=vf?+vf.value:0;
    const blocked=mode==="structural"&&(!Number.isFinite(pct)||pct>=100);
    const sg=$("#rStructuralGoal"), fg=$("#rFormGoal"), bc=$("#rStructuralBC"), so=$("#rStructuralOptions");
    if(sg) sg.style.display=mode==="structural"?"":"none";
    if(fg) fg.style.display=mode==="form"?"":"none";
    if(bc) bc.style.display=mode==="structural"?"":"none";
    if(so) so.style.display=mode==="structural"?"":"none";
    if(note) note.innerHTML=blocked?'<div class="materialwarn"><b>100% means no optimization.</b> Lower the target before running a revision. <button type="button" class="ghost" id="rVolQuick">use 35%</button></div>'
      :'<div class="bcnote">The optimizer may remove material until about '+Math.round(pct)+'% remains; kept regions stay protected.</div>';
    if(btn) btn.disabled=blocked;
    if(btn) btn.textContent=mode==="form"?"Run mass-constrained revision →":revisionRunLabel(($('[data-r="creativity"]')||{}).value||"focused");
    const q=$("#rVolQuick"); if(q) q.onclick=()=>{ vf.value=35; materialGuard(); };
  };
  if(vf){ vf.oninput=materialGuard; materialGuard(); }
  if(rmode) rmode.onchange=()=>{ const e=$("#dRevErr"); if(e) e.textContent=""; materialGuard(); };
  const cr=$('[data-r="creativity"]');
  if(cr) cr.onchange=materialGuard;
  const tp=$('[data-r="texture_pattern"]'), ta=$('[data-r="texture_angle"]'), tm=$('[data-r="texture_mapping"]');
  const updateTexturePreview=()=>{ const fields=$("#rTextureFields"), preview=$("#rTexturePreview"), scaleLabel=$("#rTextureScaleLabel");
    if(fields&&tp) fields.style.display=tp.value==="none"?"none":"";
    if(preview&&tp) preview.dataset.pattern=tp.value;
    if(scaleLabel&&tp) scaleLabel.textContent=tp.value==="leopard"?"feature size":"repeat size";
    if(preview&&ta) preview.style.setProperty("--texture-angle",(+ta.value||0)+"deg"); };
  if(tp) tp.onchange=updateTexturePreview;
  if(ta) ta.oninput=updateTexturePreview;
  if(tm) tm.onchange=updateTextureViewState;
  updateTextureViewState();
  if(cfg.engine==="structural"){                         // Phase 2 keep-regions live list
    S.editLoads=(cfg.loads||[]).map(l=>{ const o={box:(l.box||[0.94,0,0,1,1,1]).slice(),dir:(l.dir||[0,0,-1]).slice()};
      if(l.tris) o.tris=l.tris.map(t=>t.slice()); return o; });
    renderLoads();
    S.editRegions=(cfg.regions||[]).map(r=>{ const o={box:(r.box||[0.94,0,0,1,1,1]).slice(),rule:r.rule};
      if(r.tris&&r.tris.length) o.tris=r.tris.map(t=>t.slice()); return o; });
    renderRegions(); if(S.gl3d) GLV.setHighlight(pickHighlights());
    const ar=$("#rAddReg"); if(ar) ar.onclick=()=>{ syncRegionsFromDOM();
      rememberRegions(); S.editRegions.push({box:[0.94,0,0,1,1,1],rule:"solid"}); renderRegions(); };
  }
  const sa=$("#showAll"); if(sa) sa.onclick=()=>{ const g=$("#fineGrp"), open=g.style.display!=="none";
    g.style.display=open?"none":""; sa.textContent = open?("+ show all "+sa.dataset.total+" fields ▾"):"▲ hide fine controls"; };
  wrap.dataset.style = styleKey(j)||"";
  renderStyleMap($("#rStyleMap"), styleKey(j), cfg.engine, k=>{ wrap.dataset.style=k||""; });
}
async function runRevision(){
  const j=selected(); if(!j||!j.config) return;
  const cfg=JSON.parse(JSON.stringify(j.config)); const g=s=>$('[data-r="'+s+'"]');
  if(cfg.engine==="structural"){
    cfg.domain_mm=[0,1,2].map(i=>+g("dom-"+i).value);
    cfg.revision_mode=(g("revision_mode")||{}).value||"structural";
    cfg.volfrac=cfg.revision_mode==="form"?1:+g("volfrac").value/100;
    cfg.mass_tolerance_pct=+(g("mass_tolerance_pct")||{value:2}).value;
    cfg.form_operation=(g("form_operation")||{value:"facet"}).value;
    const texturePattern=(g("texture_pattern")||{value:"none"}).value;
    if(cfg.revision_mode==="form"&&(!Number.isFinite(cfg.mass_tolerance_pct)||cfg.mass_tolerance_pct<0||cfg.mass_tolerance_pct>25)){ $("#dRevErr").textContent="mass tolerance must be between 0% and 25%"; return; }
    if(cfg.revision_mode==="structural"&&(!Number.isFinite(cfg.volfrac)||cfg.volfrac>=1)){ $("#dRevErr").textContent="100% keeps the whole part; choose a lower material target or use form · preserve mass"; return; }
    const qs=g("quality"); if(qs) cfg.quality=qs.value;
    const cs=g("creativity"); if(cs) cfg.creativity=cs.value;
    const mds=g("mesh_detail"); if(mds) cfg.mesh_detail=+mds.value;
    (cfg.supports||[]).forEach((s,i)=>{for(let o=0;o<6;o++){const e=g("sup-"+i+"-"+o); if(e)s.box[o]=+e.value/100;}});
    syncLoadsFromDOM();
    cfg.loads=(S.editLoads||[]).map(l=>{ const o={box:l.box.slice(),dir:l.dir.slice()};
      if(l.tris) o.tris=l.tris.map(t=>t.slice()); return o; });
    if(cfg.revision_mode==="structural"&&!cfg.loads.length){ $("#dRevErr").textContent="structural load-path optimization needs at least one load; choose form · preserve mass to work without loads"; return; }
    if(cfg.revision_mode==="form") cfg.loads=[];
    syncRegionsFromDOM();                                // Phase 2 keep-regions
    const regs=(S.editRegions||[]).filter(r=>(r.tris&&r.tris.length)||
      (r.box&&r.box[3]>r.box[0]&&r.box[4]>r.box[1]&&r.box[5]>r.box[2]));
    const retainTriangles=regs.reduce((n,r)=>n+(r.tris?r.tris.length:0),0);
    if(retainTriangles>250000){
      $("#dRevErr").textContent="retained regions contain "+retainTriangles.toLocaleString()+" triangles; remove or narrow a region before running"; return;
    }
    if(regs.length) cfg.regions=regs; else delete cfg.regions;
    if(cfg.revision_mode==="form"&&texturePattern!=="none"){
      const height=+(g("texture_height")||{}).value, scale=+(g("texture_scale")||{}).value,
        angle=+(g("texture_angle")||{value:0}).value;
      const mapping=resolvedTextureMapping((g("texture_mapping")||{value:"wrap"}).value);
      const detail=(g("texture_detail")||{value:"fine"}).value;
      if(!SURFACE_TEXTURES.some(t=>t[0]===texturePattern)){ $("#dRevErr").textContent="choose a valid surface texture"; return; }
      if(!Number.isFinite(height)||height<.05||height>5){ $("#dRevErr").textContent="texture height must be between 0.05 mm and 5 mm"; return; }
      if(!Number.isFinite(scale)||scale<1||scale>100){ $("#dRevErr").textContent="texture repeat size must be between 1 mm and 100 mm"; return; }
      if(!Number.isFinite(angle)||angle< -180||angle>180){ $("#dRevErr").textContent="texture orientation must be between −180° and 180°"; return; }
      if(!["balanced","fine","ultra"].includes(detail)){ $("#dRevErr").textContent="choose a valid surface detail"; return; }
      cfg.surface_texture={pattern:texturePattern,mode:(g("texture_mode")||{value:"emboss"}).value,
        height_mm:height,scale_mm:scale,angle_deg:angle,mapping,detail};
    }else delete cfg.surface_texture;
  } else { for(const k of Object.keys(cfg.params)){const e=g("param-"+k); if(e)cfg.params[k]=+e.value;} }
  const rs=$("#dRecipe").dataset.style; if(rs) cfg.style=rs; else delete cfg.style;   // restyle (S2)
  $("#dRev").disabled=true; $("#dRevErr").textContent="";
  try{
    const r=await fetch("/api/jobs/"+j.id+"/revise",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({config:cfg})});
    const nj=await r.json(); if(!r.ok) throw new Error(nj.error);
    S.pendingJob=nj; S.jobs=mergeJobs([nj].concat(S.jobs));
    S.expanded[nj.root||baseName(nj.name)]=true; selectJob(nj.id); renderChrome();
  }catch(e){ $("#dRev").disabled=false; $("#dRevErr").textContent=e.message; }
}

loadStyles();
poll();
</script>
